    <meta name="twitter:description"

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Get a Free Quote - Luxury Shutters & Blinds",
      "description": "Request a personalized quote for custom shutters, blinds, and flyscreens from Luxury Shutters & Blinds in Durban.",
      "url": "https://www.luxuryshuttersandblinds.co.za/quote.html",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://www.luxuryshuttersandblinds.co.za/quote.html"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Luxury Shutters & Blinds",
        "logo": {
          "@type": "ImageObject",

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pages/quote.css">
</head>

<body>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <!-- =====================================================
         QUOTE VIEWPORT
    ===================================================== -->
    <main class="container">
        <h1 class="quote-page-title">Get a Quote</h1>
        <p class="quote-page-desc">Transform Your Space with Elegance</p>
        
        <form id="quote-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your Full Name">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="+27 XX XXX XXXX">
            </div>
            
            <div class="form-group">
                <label for="product">Product Type</label>
                <select id="product" name="product" required>
                    <option value="">Select a product</option>
                    <option value="shutters">Shutters</option>
                    <option value="blinds">Blinds</option>
                    <option value="flyscreens">Flyscreens</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Additional Details</label>
                <textarea id="message" name="message" placeholder="Please provide any dimensions, specific requirements, or details about your space..."></textarea>
            </div>
            
            <button type="submit">Submit Quote Request</button>
        </form>
    </main>

    <!-- =====================================================
         LOADING SPINNER OVERLAY
    ===================================================== -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Preparing your quote request...</p>
    </div>

    <!-- =====================================================
         MAP VIEWPORT
    ===================================================== -->
    <section class="map-section">
        <div class="container" style="padding: 0 40px;">
            <h2 class="section-title" style="text-align: center; margin-bottom: 12px;">Find Our Showroom</h2>
            <p style="text-align: center; font-weight: 700; font-size: 15px; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold);">By Appointment Only</p>
            <div class="map-wrapper">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3457.9791710727686!2d30.95264187489742!3d-29.92250182563116!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1ef7ab9710540c5b%3A0x6788dbe0d559bc85!24%20Carmichael%20Pl%2C%20Woodlands%2C%20Durban%2C%204004!5e0!3m2!1sen!2sza!4v1726777588431!5m2!1sen!2sza" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </section>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/27732899370" id="whatsapp-button" target="_blank" aria-label="Contact us on WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Icon">
        WhatsApp Us
    </a>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('quote-form');
            if (!form) return;

            // Create error placeholders inside form groups
            const formGroups = document.querySelectorAll('.form-group');
            formGroups.forEach(group => {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                group.appendChild(errorDiv);
            });

            form.addEventListener('submit', function (e) {
                e.preventDefault();

                // Reset error messages
                document.querySelectorAll('.error-message').forEach(msg => msg.style.display = 'none');

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const product = document.getElementById('product').value;
                const message = document.getElementById('message').value.trim();

                let isValid = true;

                if (!name) {
                    showError('name', 'Please enter your name');
                    isValid = false;
                }

                if (!email) {
                    showError('email', 'Please enter your email address');
                    isValid = false;
                } else if (!isValidEmail(email)) {
                    showError('email', 'Please enter a valid email address');
                    isValid = false;
                }

                if (!phone) {
                    showError('phone', 'Please enter your phone number');
                    isValid = false;
                } else if (!isValidPhone(phone)) {
                    showError('phone', 'Please enter a valid phone number');
                    isValid = false;
                }

                if (!product) {
                    showError('product', 'Please select a product');
                    isValid = false;
                }

                if (isValid) {
                    const loadingOverlay = document.getElementById('loadingOverlay');
                    loadingOverlay.style.display = 'flex';

                    const whatsappMessage = `Hello, I'm ${name}. I would like a quote for ${product}. Here are my details:\n\nEmail: ${email}\nPhone: ${phone}\n\nAdditional Details: ${message}`;
                    const encodedMessage = encodeURIComponent(whatsappMessage);
                    const whatsappLink = `https://wa.me/27732899370?text=${encodedMessage}`;

                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                        window.open(whatsappLink, '_blank');
                        form.reset();
                    }, 1500);
                }
            });

            function showError(fieldId, msgText) {
                const field = document.getElementById(fieldId);
                if (field) {
                    const errorDiv = field.parentElement.querySelector('.error-message');
                    if (errorDiv) {
                        errorDiv.textContent = msgText;
                        errorDiv.style.display = 'block';
                    }
                }
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            function isValidPhone(phone) {
                return /^[\d\s+()-]{10,}$/.test(phone);
            }
        });
    </script>
</body>

</html>
